name: CI

# Validation only. This workflow has read-only permissions, uses no secrets and never deploys.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      # npm ci installs exactly what package-lock.json records, with integrity hashes.
      - name: Install dependencies
        run: npm ci

      # Type check, lint, unit tests, static build, post-build site checks
      # (links, fragments, metadata, alt text, secret patterns) and the
      # résumé freshness check, in that order.
      - name: Verify
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
